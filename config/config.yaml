defaults:  
  - _self_  
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled  
  
hydra:  
  output_subdir: null  
  run:  
    dir: .

general:
  project: "SAT"
  run_name: "Pythia-6-8-512-dfs_packed_50k"
  devices: [0]

tok_data:
  tokenizer_path: "${model.tokenizer_path}/tokenizer.json"

data:
  packed: True
  datapath: data
  train_file: "../data/cdcl_dataset_3-6_100k.json"
  test_file: "../data/cdcl_dataset_7-8_1k.json"
  num_train: 50000
  num_test: 1000
  num_workers: 64

model:
  name: "Pythia-${model.n_layer}-${model.n_head}-${model.n_embd}-dfs-packed_50k"
  batch_size: 32
  accumulate_grad_batches: 2
  block_size: 2000
  epochs: 5
  n_layer: 6
  n_head: 8
  n_embd: 512
  vocab_size: 76
  padded_vocab_size: 76
  bos_id: 72
  eos_id: 75
  checkpoint_dir: "model/${dl_model.full_path}"
  tokenizer_path: "model/${dl_model.full_path}"

optimizer:
  warmup_steps: 500
  lr: 1e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

eval:
  config_path: "${model.checkpoint_dir}/model_config.json"
  num_examples: 128
  batch_size: 32
  eval_interval: 10
  results_dir: "data/eval_results/${model.name}"
  log_step_frequency: 50
  val_check_interval: 0.1
  callback_epoch_frequency: 1
  callback_acc_data_count: 200

dl_model:
  model_folder: "checkpoints"
  name: "EleutherAI/pythia-160m"
  full_path: "${dl_model.model_folder}/${dl_model.name}/"

convert_hf:
  in_path: "temp/${model.name}"
  out_path: "temp/hf_${model.name}"