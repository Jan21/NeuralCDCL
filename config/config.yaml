defaults:  
  - _self_  
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled  
  
hydra:  
  output_subdir: null  
  run:  
    dir: .

data_preprocess:
  raw_data_path: "../data/solved_problems.pkl"
  num_test: 512
  num_val: 2048

tok_data:
  train_file: "temp/cdcl_train.json"
  val_file: "temp/cdcl_test.json"
  tokenizer_path: "tokenizer/tokenizer.json"

data:
  datapath: temp
  train_file: "cdcl_train.json"
  val_file: "cdcl_test.json"
  num_workers: 8
  split_str: "begin"
  
model:
  name: "Pythia-${model.n_layer}-${model.n_head}-${model.n_embd}-clause_select-new_data"
  batch_size: 128
  accumulate_grad_batches: 1
  block_size: 1024
  epochs: 200
  n_layer: 12
  n_head: 8
  n_embd: 256
  vocab_size: 110
  padded_vocab_size: 110
  bos_id: 104
  eos_id: 108

optim:
  lr: 1e-2

eval:
  num_examples: ${data_preprocess.num_test}
  batch_size: 128
  results_dir: "data/eval_results/${model.name}"

convert_hf:
  in_path: "temp/${model.name}"
  out_path: "temp/hf_${model.name}"

inference:
  modelpath: "./temp/hf_Pythia-12-8-256-clause_select-new_data"
  datapath: ${data.datapath}/generalization/
  batch_size: 256
